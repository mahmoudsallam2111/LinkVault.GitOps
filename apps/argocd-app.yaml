apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkvault
  namespace: argocd
  annotations:
    # All images declared in ONE image-list annotation
    argocd-image-updater.argoproj.io/image-list: >-
      backend=docker.io/mahmoudali2111/linkvault-backend,
      frontend=docker.io/mahmoudali2111/linkvault-frontend

    # Backend — pick highest numeric tag (e.g. 30 > 29 > 28...)
    argocd-image-updater.argoproj.io/backend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/backend.force-update: "true"
    argocd-image-updater.argoproj.io/backend.allow-tags: regexp:^[0-9]+$
    argocd-image-updater.argoproj.io/backend.helm.image-name: backend.image.repository
    argocd-image-updater.argoproj.io/backend.helm.image-tag: backend.image.tag

    # Frontend — pick highest numeric tag
    argocd-image-updater.argoproj.io/frontend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/frontend.force-update: "true"
    argocd-image-updater.argoproj.io/frontend.allow-tags: regexp:^[0-9]+$
    argocd-image-updater.argoproj.io/frontend.helm.image-name: frontend.image.repository
    argocd-image-updater.argoproj.io/frontend.helm.image-tag: frontend.image.tag

    # Git write-back — credentials in write-back-method, target points to values file
    argocd-image-updater.argoproj.io/git-repository: "https://dev.azure.com/mahmoudsallam2111/LinkVault/_git/LinkVault.GitOps"
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:./values.yaml

spec:
  project: default
  source:
    repoURL: "https://dev.azure.com/mahmoudsallam2111/LinkVault/_git/LinkVault.GitOps"
    path: "charts/linkvault"
    targetRevision: main
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: linkvault
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

