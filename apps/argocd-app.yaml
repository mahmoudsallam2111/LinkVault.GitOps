apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkvault
  namespace: argocd
  annotations:
    # 1. Track Backend Image
    argocd-image-updater.argoproj.io/backend.image-list: my-backend=docker.io/mahmoudali2111/linkvault-backend
    argocd-image-updater.argoproj.io/backend.update-strategy: latest
    argocd-image-updater.argoproj.io/backend.helm.image-name: backend.image.repository
    argocd-image-updater.argoproj.io/backend.helm.image-tag: backend.image.tag
    argocd-image-updater.argoproj.io/backend.pull-secret: secret:argocd/docker-hub-creds

    # 2. Track Frontend Image
    argocd-image-updater.argoproj.io/frontend.image-list: my-frontend=docker.io/mahmoudali2111/linkvault-frontend
    argocd-image-updater.argoproj.io/frontend.update-strategy: latest
    argocd-image-updater.argoproj.io/frontend.helm.image-name: frontend.image.repository
    argocd-image-updater.argoproj.io/frontend.helm.image-tag: frontend.image.tag
    argocd-image-updater.argoproj.io/frontend.pull-secret: secret:argocd/docker-hub-creds

    # 3. Write updates back to the GitOps repository
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: gitops:secret:argocd/git-creds
spec:
  project: default
  source:
    # IMPORTANT: Update this repoURL to point to your actual Git repository URL
    # after you push the LinkVault.GitOps folder to your source control.
    repoURL: "https://dev.azure.com/mahmoudsallam2111/LinkVault/_git/LinkVault.GitOps"
    path: "charts/linkvault"
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: linkvault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
